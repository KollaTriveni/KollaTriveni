<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malicious Email Detection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Inbox Defender</h1>
    <form id="emailForm">
      <label for="emailContent">Paste Email Content Here:</label>
      <textarea id="emailContent" name="emailContent" rows="10" cols="50" placeholder="Paste email content here"></textarea>
      <button type="submit">Analyze Email</button>
    </form>
    <div id="result" class="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
